# CONVERSION SAMPLE -- skills/mock-ui/assets/example/new-loan.html -> scrNewLoan
# Written by hand on 2026-11-15 by following skills/create-app/SKILL.md (control picker,
# assets/patterns/, references/layout-mapping.md). It shows that one mock-ui page is
# acceptable create-app input. It is ONE sample, not proof, and it is not model output
# from a fresh session. tests/test_mock_lint.py runs pa_lint.py on it.
#
# Geometry is copied from the mockup's CSS 1:1: the mockup is 1366 x 768 and every box
# is an absolute px position, so layout-mapping.md has nothing left to compute.
# Child X/Y inside a card are the CSS values, measured from the card's edge as in the
# create-app examples (the CSS measures from inside the 1px border: a 1px difference).
#
# Declared gaps (no confirmed equivalent in controls.yaml; see the mockup):
# - Due back is <input type="date">. DatePicker is in unattempted_controls, so this file
#   uses a Classic/TextInput with a date hint. Paste-test
#   skills/create-app/assets/test-snippets/datepicker.pa.yaml first.
# - Reason is a <textarea>. A multi-line mode on Classic/TextInput is not catalogued, so
#   txtReason is a tall single-line input.
# - Quantity is <input type="number">. No numeric format property is catalogued.
# - The two dropdowns have square corners: Classic/DropDown has no Radius* in the catalog
#   (the mockup draws 6px corners).
# - Nav labels are centred: Classic/Button has no confirmed text alignment, and the
#   create-app sidebar-nav-item pattern centres them too (the mockup indents to x 56).
# - Nav icons: the mockup draws list and plus glyphs as inline SVG; Icon.Document and
#   Icon.Edit are the nearest members any bundled example uses.
# - The avatar is a data-image placeholder; it stays a filled container until there is
#   a photo source.
# - Send request carries data-action="submit:Loans run-flow:NotifyApprover". Writing to
#   the Loans list and running the flow need a data source and a flow connection, which
#   the create-app data-binding notes mark UNVERIFIED; OnSelect only navigates for now.
