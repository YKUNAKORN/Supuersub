<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New request</title>
<style>
  :root {
    /* Generated by tokens_to_css.py from DESIGN.md (Fixture Desk), target power-apps.
       Regenerate instead of editing; mock_lint.py --design checks for drift. */
    /* canvas (power-apps target) */
    --canvas-width: 1366px;
    --canvas-height: 768px;
    /* colors */
    --color-primary: #1f4fd1;
    --color-on-primary: #ffffff;
    --color-surface: #f5f6f8;
    --color-surface-raised: #ffffff;
    --color-on-surface: #1b1d22;
    --color-border: #d5d9e0;
    /* typography */
    --font-body-md-family: "Segoe UI", sans-serif;
    --font-body-md-size: 14px;
    --font-body-md-weight: 400;
    --font-body-md-line-height: 21px;
    --font-label-md-family: "Segoe UI", sans-serif;
    --font-label-md-size: 14px;
    --font-label-md-weight: 700;
    --font-label-md-line-height: 20px;
    /* rounded */
    --radius-md: 6px;
    /* spacing */
    --space-md: 16px;
    /* components */
    --button-primary-bg: var(--color-primary);
    --button-primary-text: var(--color-on-primary);
    --button-primary-radius: var(--radius-md);
    --button-primary-height: 40px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { position: relative; width: var(--canvas-width); height: var(--canvas-height);
         overflow: hidden; background: var(--color-surface); color: var(--color-on-surface);
         font-family: var(--font-body-md-family); font-size: var(--font-body-md-size);
         line-height: var(--font-body-md-line-height); }
  .nav { position: absolute; top: 0px; width: 160px; height: 48px; line-height: 48px;
         padding-left: 16px; color: var(--color-on-surface); text-decoration: none; }
  .nav-1 { left: 0px; }
  .nav-2 { left: 160px; }
  .btn { position: absolute; height: var(--button-primary-height); width: 140px;
         background: var(--button-primary-bg); color: var(--button-primary-text);
         border: 1px solid var(--button-primary-bg); border-radius: var(--button-primary-radius);
         font-family: var(--font-label-md-family); font-size: var(--font-label-md-size);
         font-weight: var(--font-label-md-weight); line-height: 38px; text-align: center;
         text-decoration: none; }
  .card { position: absolute; left: 24px; top: 72px; width: 600px; height: 200px;
          background: var(--color-surface-raised); border: 1px solid var(--color-border);
          border-radius: var(--radius-md); }

  .lbl { position: absolute; left: 24px; width: 300px; height: 16px; }
  .fld { position: absolute; left: 24px; width: 300px; height: 40px; }
  .lbl-title { top: 16px; }
  .fld-title { top: 36px; }
  .lbl-priority { top: 84px; }
  .fld-priority { top: 104px; }
  .btn-cancel { left: 300px; top: 152px; }
  .btn-send { left: 452px; top: 152px; }
</style>
</head>
<body data-screen="scrNewRequest" data-title="New request">
  <a class="nav nav-1" href="home.html" data-nav="scrHome">Requests</a>
  <a class="nav nav-2" href="new-request.html" data-nav="scrNewRequest">New request</a>
  <form class="card" action="home.html" method="get" data-source="Requests">
    <label class="lbl lbl-title" for="req-title">Title</label>
    <input class="fld fld-title" id="req-title" name="Title" type="text" data-field="Title">
    <label class="lbl lbl-priority" for="req-priority">Priority</label>
    <select class="fld fld-priority" id="req-priority" name="Priority" data-field="Priority">
      <option>Low</option>
      <option>High</option>
    </select>
    <a class="btn btn-cancel" href="home.html" data-nav="scrHome">Cancel</a>
    <button class="btn btn-send" type="submit" data-action="submit:Requests run-flow:NotifyApprover" data-nav="scrHome">Send</button>
  </form>
</body>
</html>
