# scrLoanList -- converted from supersub/mockup/loan-list.html (mock-ui example, target
# power-apps, canvas 1366 x 768). One screen of three; see PASTE-ORDER.md.
# Written in a working session by following create-app's SKILL.md and
# references/from-mock-ui.md. One sample, not a fresh-session model run.
#
# Navigation: every data-nav is a Navigate() to a screen id in sitemap.json
# (scrNewLoan, scrLoanDetail, and this screen for the active sidebar row). The target
# screens must exist in the app before these formulas resolve: PASTE-ORDER.md.
#
# Data hints (data-repeat="Loans", data-field Title / Borrower / DueDate / Status):
# the three sample rows are static Labels, which is the confirmed path. Binding them
# to the Loans list needs a Gallery, which controls.yaml lists as unattempted. Paste-
# test assets/test-snippets/gallery.pa.yaml first. The Open buttons all go to the
# same static detail screen until then.
#
# Actions: Apply carries data-action="filter:Loans". Its OnSelect is a placeholder;
# filtering needs the Gallery above.
#
# Declared gaps (no confirmed equivalent in controls.yaml):
# - The table head has square top corners: Rectangle Radius* is unverified (the
#   mockup rounds them 8px to match the card).
# - Status badges are a GroupContainer (radius confirmed) holding a Label.
# - The active sidebar row is bold in the mockup: FontWeight is unverified on
#   Classic/Button, so it is left out. Nav labels are centred, not indented to x 56.
# - Nav icons are inline SVG in the mockup; Icon.Document and Icon.Edit are the
#   nearest members a bundled example uses.
# - Status is a <select> of fixed choices: Classic/DropDown, which has no Radius*
#   (the mockup draws 6px corners).
