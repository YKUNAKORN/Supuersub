# scrNewLoan -- converted from supersub/mockup/new-loan.html (mock-ui example, target
# power-apps, canvas 1366 x 768). One screen of three; see PASTE-ORDER.md.
# Written in a working session by following create-app's SKILL.md and
# references/from-mock-ui.md. One sample, not a fresh-session model run.
# tests/fixtures/mock-ui/converted/scrNewLoan.pa.yaml is the same screen converted
# alone, before this branch existed: there the other screens are commented
# placeholders; here they are real Navigate() targets and every name carries the
# screen, so the three files can share one app.
#
# Data hints (data-source="Loans", data-field Title / Quantity / DueDate / Site /
# Reason): plain input controls, each with the column it maps to in a comment. A Form
# bound to Loans is unattempted: paste-test assets/test-snippets/form.pa.yaml first.
#
# Actions: Send request carries data-action="submit:Loans run-flow:NotifyApprover" and
# data-nav="scrLoanList". OnSelect only navigates for now. Writing to Loans and calling
# the NotifyApprover flow need a data source and a flow connection, which
# data-binding.md marks UNVERIFIED; the flow's arguments are defined by the flow
# (create-flow plans it), so none are guessed here.
#
# Declared gaps (no confirmed equivalent in controls.yaml):
# - Due back is <input type="date">: a Classic/TextInput with a date hint stands in.
#   Paste-test assets/test-snippets/datepicker.pa.yaml first.
# - Reason is a <textarea>: a tall single-line input (multi-line not catalogued).
# - Quantity is <input type="number">: no numeric format property is catalogued.
# - The two dropdowns have square corners: Classic/DropDown has no Radius*.
# - The active sidebar row is bold in the mockup: FontWeight is unverified on
#   Classic/Button, so it is left out. Nav labels are centred, not indented to x 56.
# - Nav icons: Icon.Document and Icon.Edit stand in for the mockup's inline SVG.
