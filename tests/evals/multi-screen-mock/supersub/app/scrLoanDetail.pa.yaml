# scrLoanDetail -- converted from supersub/mockup/loan-detail.html (mock-ui example,
# target power-apps, canvas 1366 x 768). One screen of three; see PASTE-ORDER.md.
# Written in a working session by following create-app's SKILL.md and
# references/from-mock-ui.md. One sample, not a fresh-session model run.
#
# Data hints (data-source="Loans", data-field Title / Borrower / LoanDate / DueDate /
# Site / Status): static Labels with the mockup's sample values, each value Label
# naming its column in a comment. Showing the selected loan needs the record passed
# from the list (a Gallery's Selected item, or a variable set in the list's Open
# button), and neither is confirmed: see data-binding.md and
# assets/test-snippets/gallery.pa.yaml.
#
# Actions: Mark returned carries data-action="update:Loans" (a Patch, UNVERIFIED in
# data-binding.md); Report lost carries data-action="run-flow:ReportLostItem" (a flow
# call, UNVERIFIED; its arguments are defined by the flow, which create-flow plans).
# Both OnSelect formulas are placeholders.
#
# Declared gaps (no confirmed equivalent in controls.yaml):
# - The Actions panel is marked data-unsupported="box-shadow". box-shadow is in
#   controls.yaml's impossible_css: there is no shadow property, so the panel keeps
#   the 1px border the profile names as the substitute, and no shadow is faked.
# - The Status badge is a GroupContainer (radius confirmed) holding a Label.
# - The item photo is a data-image placeholder: a filled container until there is an
#   image source.
# - The active sidebar row is bold in the mockup: FontWeight is unverified on
#   Classic/Button, so it is left out. Nav labels are centred, not indented to x 56.
# - Nav icons: Icon.Document and Icon.Edit stand in for the mockup's inline SVG.
