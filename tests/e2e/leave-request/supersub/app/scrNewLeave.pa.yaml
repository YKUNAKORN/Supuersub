# scrNewLeave -- converted from supersub/mockup/new-leave.html (Restday, target
# power-apps, canvas 1366 x 768). One screen of two; see PASTE-ORDER.md.
# Written in the phase 07 working session by following create-app's SKILL.md and
# references/from-mock-ui.md, not in a fresh model session. The sidebar and top bar
# follow the bundled Kitroom conversion, re-coloured from Restday's DESIGN.md.
#
# Data hints (data-source="LeaveRequests", data-field LeaveType / ApproverEmail /
# StartDate / EndDate / Reason): plain input controls, each with the column it maps to
# in a comment. A Form bound to the list is unattempted: paste-test
# assets/test-snippets/form.pa.yaml first. Column names come from
# supersub/lists/LeaveRequests.list.json (create-list).
#
# Actions: ส่งใบลา carries data-action="submit:LeaveRequests run-flow:NotifyApprover" and
# data-nav="scrLeaveList". OnSelect only navigates for now. Writing to the list and
# calling NotifyApprover need a data source and a flow connection, which data-binding.md
# marks UNVERIFIED; the flow (create-flow) has a button trigger in this version, so the
# app does not call it yet.
#
# Declared gaps (no confirmed equivalent in controls.yaml):
# - วันเริ่ม and วันสิ้นสุด are <input type="date">: Classic/TextInput with a date hint
#   stands in. Paste-test assets/test-snippets/datepicker.pa.yaml first.
# - เหตุผล is a <textarea>: a tall single-line input (multi-line not catalogued).
# - The dropdown has square corners: Classic/DropDown has no Radius*.
# - The active sidebar row is bold in the mockup: FontWeight is unverified on
#   Classic/Button, so it is left out. Nav labels are centred, not indented to x 56.
# - Nav icons: Icon.Document and Icon.Edit stand in for the mockup's inline SVG.
