# scrLeaveList -- converted from supersub/mockup/leave-list.html (Restday, target
# power-apps, canvas 1366 x 768). One screen of two; see PASTE-ORDER.md.
# Written in the phase 07 working session by following create-app's SKILL.md and
# references/from-mock-ui.md, not in a fresh model session. The sidebar and top bar
# follow the bundled Kitroom conversion, re-coloured from Restday's DESIGN.md.
#
# Navigation: every data-nav is a Navigate() to a screen id in sitemap.json
# (scrNewLeave, and this screen for the active sidebar row).
#
# Data hints (data-repeat="LeaveRequests", data-field LeaveType / StartDate / EndDate /
# Reason / Status): the three sample rows are static Labels, the confirmed path.
# Binding them to the list needs a Gallery, which controls.yaml lists as unattempted.
# Paste-test assets/test-snippets/gallery.pa.yaml first.
#
# Declared gaps (no confirmed equivalent in controls.yaml):
# - The table head has square top corners: Rectangle Radius* is unverified.
# - Status badges are a GroupContainer (radius confirmed) holding a Label.
# - The active sidebar row is bold in the mockup: FontWeight is unverified on
#   Classic/Button, so it is left out. Nav labels are centred, not indented to x 56.
# - Nav icons: Icon.Document and Icon.Edit stand in for the mockup's inline SVG.
